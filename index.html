<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>納車行程管理</title>
    <!-- 版を変えたら ?v= を変える（GitHub Pages は index.html を最大10分キャッシュする） -->
    <link rel="stylesheet" href="./css/style.css?v=20261120m">
    <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
</head>
<body>
    <div id="view-message" class="view">
        <h1 id="message-title">読み込んでいます…</h1>
        <p id="message-body"></p>
    </div>

    <div id="view-list" class="view" hidden>
        <header class="bar">
            <div class="bar-title">未納車一覧 <span id="count" class="count"></span></div>
            <div class="bar-who" id="who"></div>
        </header>
        <div class="filters">
            <label class="filter">担当
                <select id="staff-select"><option value="">すべて</option></select>
            </label>
            <label class="filter" id="store-wrap" hidden>店舗
                <select id="store-select"><option value="">すべての店舗</option></select>
            </label>
            <label class="filter" id="grid-editor-wrap" hidden>入れた方
                <input type="text" id="grid-editor" list="staff-names" maxlength="255" autocomplete="off" placeholder="お名前">
            </label>
            <button type="button" id="reload-list" class="btn-sub">読み直す</button>
            <span id="refresh-info" class="refresh-info"></span>
        </div>
        <div id="list-notice" class="notice" hidden></div>
        <div id="grid-status" class="grid-status" hidden></div>
        <div id="list" class="list"></div>
    </div>

    <div id="view-detail" class="view" hidden>
        <header class="bar">
            <button type="button" id="back-btn" class="btn-back">← 一覧</button>
            <div class="bar-title-wrap">
                <div class="bar-title" id="detail-title"></div>
                <div class="bar-who" id="detail-sub"></div>
                <div class="bar-who refresh-info" id="detail-refresh"></div>
            </div>
        </header>
        <div id="detail-notice" class="notice" hidden></div>
        <section id="tasks" class="tasks" hidden>
            <div class="tasks-head">タスク <span id="tasks-count" class="tasks-count"></span></div>
            <div id="tasks-msg" class="notice" hidden></div>
            <div id="tasks-list" class="tasks-list"></div>
            <div class="task-add">
                <label class="task-f task-f-subj">件名<input type="text" id="task-subject" maxlength="255" autocomplete="off" placeholder="例: 車庫証明の書類を受け取る"></label>
                <label class="task-f">期限<input type="date" id="task-due"></label>
                <label class="task-f">誰の分<input type="text" id="task-who" list="staff-names" maxlength="100" autocomplete="off" placeholder="お名前"></label>
                <button type="button" id="task-add" class="btn-sub">タスクを足す</button>
            </div>
        </section>
        <div id="items" class="items"></div>
        <div id="save-bar" class="save-bar" hidden>
            <div id="editor-wrap" class="editor" hidden>
                <label for="editor-input">入れた方</label>
                <input type="text" id="editor-input" list="staff-names" maxlength="255" autocomplete="off">
                <div id="editor-last" class="editor-last"></div>
            </div>
            <button type="button" id="save-btn" class="btn-save" disabled>変更なし</button>
        </div>
        <datalist id="staff-names"></datalist>
    </div>

    <div id="env-badge" class="env-badge" hidden></div>

    <script src="./js/config.js?v=20261120m"></script>
    <script src="./js/app.js?v=20261120m"></script>
</body>
</html>
